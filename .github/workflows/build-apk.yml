name: Build LEVIKO VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: flutter create . --platforms=android --org com.leviko.vpn

      - name: Set App Display Name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Manifest not found: {manifest}")

          text = manifest.read_text(encoding="utf-8")
          app_match = re.search(r"<application\b[^>]*>", text, flags=re.IGNORECASE | re.DOTALL)
          if app_match is None:
              print("Manifest content:")
              print(text)
              raise SystemExit("Could not find <application> element")

          app_tag = app_match.group(0)
          label_pattern = r'\bandroid:label\s*=\s*"[^"]*"'
          if re.search(label_pattern, app_tag):
              updated_tag = re.sub(
                  label_pattern,
                  'android:label="Leviko VPN"',
                  app_tag,
                  count=1
              )
          else:
              updated_tag = app_tag[:-1] + ' android:label="Leviko VPN">'

          updated_text = text[:app_match.start()] + updated_tag + text[app_match.end():]
          manifest.write_text(updated_text, encoding="utf-8")
          print("App display name set to Leviko VPN")
          PY

      - name: Check App Icon File
        run: |
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: Logo file is missing."
            echo "Upload your PNG logo to: assets/icon/app_icon.png"
            exit 1
          fi

      - name: Install Icon Generator
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure Launcher Icon
        run: |
          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            min_sdk_android: 21
          YAML

      - name: Generate Android Launcher Icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEVIKO-VPN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
