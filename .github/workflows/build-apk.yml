name: Build LEVIKO VPN APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Create Android Project
    run: flutter create . --platforms=android --org com.leviko.vpn

  - name: Set App Display Name
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import re

      manifest = Path("android/app/src/main/AndroidManifest.xml")
      content = manifest.read_text(encoding="utf-8")

      content, count = re.subn(
          r'android:label="[^"]*"',
          'android:label="Leviko VPN"',
          content,
          count=1
      )

      if count == 0:
          raise SystemExit("ERROR: android:label not found in AndroidManifest.xml")

      manifest.write_text(content, encoding="utf-8")
      print("App name set to Leviko VPN")
      PY

  - name: Install Dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LEVIKO-VPN-APK
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
