name: Build LEVIKO VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: leviko-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip zip curl python3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          add-to-path: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create . --platforms=android --org com.leviko.vpn

      - name: Configure Android for v2ray_box
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          permissions = [
              'android.permission.INTERNET',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.CHANGE_NETWORK_STATE',
              'android.permission.ACCESS_NETWORK_STATE',
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  text = text.replace('<application', f'<uses-permission android:name="{permission}" />\n    <application', 1)
          if 'com.example.v2ray_box.bg.VPNService' not in text:
              services = '''
                  <service
                      android:name="com.example.v2ray_box.bg.VPNService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="vpn" />
                  </service>
                  <service
                      android:name="com.example.v2ray_box.bg.ProxyService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="proxy" />
                  </service>'''
              text = text.replace('</application>', services + '\n    </application>')
          text = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', text, count=1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="Leviko VPN"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('android/app Gradle file not found')
          content = gradle.read_text(encoding='utf-8')
          if gradle.suffix == '.kts':
              if 'multiDexEnabled' not in content:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        multiDexEnabled = true', content, count=1)
              if 'useLegacyPackaging' not in content:
                  content = re.sub(r'android\s*\{', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', content, count=1)
              if 'fileTree(mapOf("dir" to "libs"' not in content:
                  content += '\ndependencies {\n    implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.aar"))))\n}\n'
          else:
              if 'multiDexEnabled' not in content:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        multiDexEnabled true', content, count=1)
              if 'useLegacyPackaging' not in content:
                  content = re.sub(r'android\s*\{', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', content, count=1)
              if "fileTree(dir: 'libs'" not in content:
                  content += "\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.aar'])\n}\n"
          gradle.write_text(content, encoding='utf-8')
          PYCODE

      - name: Verify app assets
        run: test -s assets/icon/app_icon.png

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Download and patch v2ray_box Xray builder
        shell: bash
        run: |
          mkdir -p scripts android/app/libs
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            https://raw.githubusercontent.com/pesaregorg/v2ray_box/main/example/scripts/build_android_libxray.sh \
            -o scripts/build_android_libxray.sh
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('scripts/build_android_libxray.sh')
          s = p.read_text(encoding='utf-8')
          marker = "  cat >\"$patch_file\" <<'EOF'\n"
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Could not locate embedded Android compatibility wrapper in upstream builder')
          start += len(marker)
          end_marker = '\nEOF\n  log "Injected Android compatibility APIs into libXray source: ${patch_file}"'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('Could not locate end of embedded Android compatibility wrapper')
          wrapper = '''package libXray

          import (
              "context"
              "errors"
              "fmt"
              "io"
              "net"
              "net/http"
              "strings"
              "time"

              "github.com/xtls/libxray/nodep"
              corenet "github.com/xtls/xray-core/common/net"
              "github.com/xtls/xray-core/core"
          )

          // MeasureOutboundDelay runs a real HTTP probe through this exact Xray
          // outbound. It returns the base64 CallResponse expected by v2ray_box.
          // Do not replace this with a TCP port check: a quota-expired account
          // may still accept TCP while rejecting proxy traffic.
          func MeasureOutboundDelay(configJSON string, url string, timeoutSec int64) string {
              var response nodep.CallResponse[int64]

              if strings.TrimSpace(configJSON) == "" {
                  return response.EncodeToBase64(nodep.PingDelayError, fmt.Errorf("empty config JSON"))
              }
              if strings.TrimSpace(url) == "" {
                  url = "https://www.gstatic.com/generate_204"
              }
              if timeoutSec <= 0 {
                  timeoutSec = 7
              }
              if timeoutSec > 60 {
                  timeoutSec = 60
              }

              inst, err := core.StartInstance("json", []byte(configJSON))
              if err != nil {
                  return response.EncodeToBase64(nodep.PingDelayError, err)
              }
              defer inst.Close()

              delay, err := measureDelayByCoreDial(inst, url, time.Duration(timeoutSec)*time.Second)
              if err != nil {
                  if errors.Is(err, context.DeadlineExceeded) || errors.Is(err, context.Canceled) {
                      return response.EncodeToBase64(nodep.PingDelayTimeout, err)
                  }
                  return response.EncodeToBase64(nodep.PingDelayError, err)
              }
              return response.EncodeToBase64(delay, nil)
          }

          func measureDelayByCoreDial(inst *core.Instance, url string, timeout time.Duration) (int64, error) {
              ctx, cancel := context.WithTimeout(context.Background(), timeout)
              defer cancel()

              tr := &http.Transport{
                  TLSHandshakeTimeout: timeout / 2,
                  DialContext: func(ctx context.Context, network, addr string) (net.Conn, error) {
                      dest, err := corenet.ParseDestination(fmt.Sprintf("%s:%s", network, addr))
                      if err != nil {
                          return nil, err
                      }
                      return core.Dial(ctx, inst, dest)
                  },
              }
              defer tr.CloseIdleConnections()

              client := &http.Client{Transport: tr, Timeout: timeout}
              var best int64 = -1
              var lastErr error
              for i := 0; i < 2; i++ {
                  req, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)
                  if err != nil {
                      lastErr = err
                      continue
                  }
                  started := time.Now()
                  resp, err := client.Do(req)
                  if err != nil {
                      lastErr = err
                      continue
                  }
                  if resp.Body != nil {
                      _, _ = io.Copy(io.Discard, resp.Body)
                      _ = resp.Body.Close()
                  }
                  if resp.StatusCode != http.StatusOK && resp.StatusCode != http.StatusNoContent {
                      lastErr = fmt.Errorf("unexpected HTTP status: %s", resp.Status)
                      continue
                  }
                  elapsed := time.Since(started).Milliseconds()
                  if best < 0 || elapsed < best {
                      best = elapsed
                  }
              }
              if best >= 0 {
                  return best, nil
              }
              if lastErr != nil {
                  return -1, lastErr
              }
              return -1, fmt.Errorf("delay test failed")
          }
          '''
          # Keep heredoc delimiters and logging line from the upstream script.
          s = s[:start] + wrapper + s[end:]
          if 'nodep.CallResponse[int64]' not in wrapper or 'core.Dial(ctx, inst, dest)' not in wrapper:
              raise SystemExit('Real Xray outbound delay implementation is missing')
          if 'func SetTunFd(fd int)' in wrapper:
              raise SystemExit('Do not redeclare SetTunFd; upstream xray_wrapper.go already exports it')
          if 'func MeasureOutboundDelay(configJSON string, url string, timeoutSec int64) string' not in wrapper:
              raise SystemExit('Android compatibility wrapper verification failed')
          p.write_text(s, encoding='utf-8')
          PYCODE
          chmod +x scripts/build_android_libxray.sh
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

      # v2ray_box 1.0.6 requires compatibility symbols. The upstream wrapper
      # already exports SetTunFd; the compatibility file must not redeclare it.
      - name: Build Xray Android library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export GOPROXY=https://proxy.golang.org,direct
          built=false
          for attempt in 1 2 3; do
            echo "Xray AAR build attempt ${attempt}/3"
            if bash scripts/build_android_libxray.sh --libxray-ref v26.3.27 --android-abis arm64-v8a,x86_64; then
              built=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt failed; retrying after 12 seconds (network/geodata downloads can be transient)."
              sleep 12
            fi
          done
          [ "$built" = true ] || { echo 'Xray AAR build failed after 3 attempts'; exit 1; }
          test -s android/app/libs/libxray.aar
          echo 'Generated AAR contents:'
          unzip -l android/app/libs/libxray.aar | grep -E 'jni/(arm64-v8a|x86_64)/'

      - name: Generate launcher icons
        run: |
          dart pub global activate flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'ICON_CONFIG'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: 'assets/icon/app_icon.png'
            min_sdk_android: 21
          ICON_CONFIG
          dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk leviko-vpn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEVIKO-VPN-APK
          path: leviko-vpn.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: LEVIKO VPN ${{ steps.app_version.outputs.version }}
          body: 'LEVIKO VPN Android build using Xray-core through v2ray_box.'
          files: leviko-vpn.apk
          overwrite_files: true
          make_latest: true
