name: Build LEVIKO VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: flutter create . --platforms=android --org com.leviko.vpn

      - name: Set App Display Name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated")
          text = manifest.read_text(encoding="utf-8")
          match = re.search(r"<application\\b[^>]*>", text, flags=re.DOTALL)
          if not match:
              raise SystemExit("Could not find the application tag")
          tag = match.group(0)
          if re.search(r'android:label\\s*=', tag):
              tag = re.sub(r'android:label\\s*=\\s*"[^"]*"', 'android:label="Leviko VPN"', tag, count=1)
          else:
              tag = tag[:-1] + ' android:label="Leviko VPN">'
          text = text[:match.start()] + tag + text[match.end():]
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Check App Icon File
        run: |
          test -f assets/icon/app_icon.png || {
            echo "ERROR: Upload your logo to assets/icon/app_icon.png in the repository."
            exit 1
          }

      - name: Install Icon Generator
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure Launcher Icon
        run: |
          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            min_sdk_android: 21
          YAML

      - name: Generate Android Launcher Icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEVIKO-VPN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
