name: Build LEVIKO VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: flutter create . --platforms=android --org com.leviko.vpn

      - name: Set App Display Name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          match = re.search(r"<application\b[^>]*>", text, flags=re.I | re.S)
          if not match:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")
          tag = match.group(0)
          label = r'\bandroid:label\s*=\s*"[^"]*"'
          if re.search(label, tag):
              tag = re.sub(label, 'android:label="Leviko VPN"', tag, count=1)
          else:
              tag = tag[:-1] + ' android:label="Leviko VPN">'
          manifest.write_text(text[:match.start()] + tag + text[match.end():], encoding="utf-8")
          PY

      - name: Verify App Icon
        run: test -s assets/icon/app_icon.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart pub global activate flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            min_sdk_android: 21
          YAML
          dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk leviko-vpn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEVIKO-VPN-APK
          path: leviko-vpn.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read App Version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ -z "$VERSION" ]; then echo "Could not read version from pubspec.yaml"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Leviko VPN ${{ steps.app_version.outputs.version }}
          body: "نسخه انتشار‌یافته Leviko VPN"
          files: leviko-vpn.apk
          overwrite_files: true
          make_latest: true
